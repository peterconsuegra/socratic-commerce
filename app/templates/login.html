{% extends "layout_logout.html" %}

{% block title %}Log in · Second Order{% endblock %}

{% block content %}
<div class="auth-card">
  <h2>Welcome back</h2>
  <p class="auth-sub">Log in to see who is coming back this month.</p>

  <form method="POST" action="{{ url_for('main.login') }}">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input
        type="text"
        name="username"
        id="username"
        class="form-control"
        autocomplete="username"
        autofocus
        required
      >
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        class="form-control"
        autocomplete="current-password"
        required
      >
    </div>
    <button type="submit" class="btn btn-primary w-100">Log in</button>
  </form>

  <p class="auth-foot">
    New here? <a href="{{ url_for('main.register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
