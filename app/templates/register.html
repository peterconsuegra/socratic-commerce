{% extends "layout_logout.html" %}

{% block title %}{{ _("Create account") }} · Second Order{% endblock %}

{% block content %}
<div class="auth-card">
  <h2>{{ _("Create your account") }}</h2>
  <p class="auth-sub">{{ _("Pick a username and a password to get started.") }}</p>

  <form method="POST" action="{{ url_for('main.register') }}">
    <div class="mb-3">
      <label for="username" class="form-label">{{ _("Username") }}</label>
      <input
        type="text"
        name="username"
        id="username"
        class="form-control"
        autocomplete="username"
        autofocus
        required
      >
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">{{ _("Password") }}</label>
      <input
        type="password"
        name="password"
        id="password"
        class="form-control"
        autocomplete="new-password"
        required
      >
    </div>
    <button type="submit" class="btn btn-primary w-100">{{ _("Create account") }}</button>
  </form>

  <p class="auth-foot">
    {{ _("Already have an account?") }} <a href="{{ url_for('main.login') }}">{{ _("Log in") }}</a>
  </p>
</div>
{% endblock %}
