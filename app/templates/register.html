{% extends "layout_logout.html" %}

{% block title %}Create account · Second Order{% endblock %}

{% block content %}
<div class="auth-card">
  <h2>Create your account</h2>
  <p class="auth-sub">Pick a username and a password to get started.</p>

  <form method="POST" action="{{ url_for('main.register') }}">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input
        type="text"
        name="username"
        id="username"
        class="form-control"
        autocomplete="username"
        autofocus
        required
      >
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        class="form-control"
        autocomplete="new-password"
        required
      >
    </div>
    <button type="submit" class="btn btn-primary w-100">Create account</button>
  </form>

  <p class="auth-foot">
    Already have an account? <a href="{{ url_for('main.login') }}">Log in</a>
  </p>
</div>
{% endblock %}
